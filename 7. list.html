<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title> List </title>

</head>


<body>

  <h1> This is Unordered list </h1>

  <ul>
    <li> One </li>
    <li> Two </li>
    <li> Three </li>
  </ul>

  <h2> This is ordered list </h2>

  <ol>
    <li> One </li>
    <li> Two </li>
    <li> Three </li>
  </ol>

  <h3> Ordered list with styling </h3>

  <ol type="I" >
    <li> One </li>
    <li> Two </li>
  </ol>

  
</body>
</html>

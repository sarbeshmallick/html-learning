<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title> Tables </title>

  <style>

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      color: #FFF
    }

    td, th {
      border: 1px solid black; 
      padding: 10px;
    }

    tr {
      background-color: #313131;
    }


  </style>

</head>


<body>

  <table>

    <tr>
      <th>Country</th>
      <th>Country Code</th>
      <th>Email</th>
    </tr>

    <tr>
      <td>India</td>
      <td>IN</td>
      <td>india@gov.in</td>
    </tr>

   <tr>
    <td>United States</td>
    <td>US</td>
    <td>usa@gov.us</td>
   </tr>

   <tr>
    <td>Japan</td>
    <td>JP</td>
    <td>japan@gov.jp</td>
   </tr>

   <tr>
    <td>China</td>
    <td>CN</td>
    <td>china@gov.cn</td>
   </tr>
  

</table>

</body>
</html>
